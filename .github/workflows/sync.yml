name: 同期と週末の割り振り

# 15分ごと: 中継に届いた追加・変更を取り込み、投稿の本文を読み取り、暗号化して保存する。
# 木曜の朝7時（日本時間）を過ぎた最初の回で、今週末の予定を自動で割り振る。
# GitHub の定時実行は遅れることがあるので、割り振りは「木曜7時以降で、まだ無ければ作る」で判定している。
#
# 守り: Claude Code（外部パッケージ）を入れる手順・動かす手順には、データの鍵（DONICHI_KEY）を渡さない。
# GitHub への書き込み権限は最後の push の手順だけで使う（checkout に残さない）。外部の Action はコミットで固定。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_AI: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 同期する
        id: sync
        env:
          DONICHI_KEY: ${{ secrets.DONICHI_KEY }}
        run: node scripts/sync.mjs

      - name: Claude Code を入れる（鍵は渡さない・版を固定）
        if: env.HAS_AI == 'true' && steps.sync.outputs.need_ai != '0'
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Claude で読み取る（データの鍵は渡さない）
        if: env.HAS_AI == 'true' && steps.sync.outputs.need_ai != '0'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/ai.mjs

      - name: 読み取り結果を合わせる
        if: env.HAS_AI == 'true' && steps.sync.outputs.need_ai != '0'
        env:
          DONICHI_KEY: ${{ secrets.DONICHI_KEY }}
        run: node scripts/ai-merge.mjs

      - name: 保存する
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --staged --quiet; then
            echo "変更はありません"
          else
            git commit -m "同期 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
            git pull --rebase origin main
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
