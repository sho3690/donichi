name: 同期と週末の割り振り

# 15分ごと: 中継に届いた追加・変更を取り込み、投稿の本文を読み取り、暗号化して保存する。
# 木曜の朝7時（日本時間）を過ぎた最初の回で、今週末の予定を自動で割り振る。
# GitHub の定時実行は遅れることがあるので、割り振りは「木曜7時以降で、まだ無ければ作る」で判定している。
#
# 15分ごとに動かすしくみ:
# - 新しいリポジトリでは GitHub の定時実行（schedule）が一度も起動しないことがある（2026年に多数の報告）。
#   そこで各回の next ジョブが、環境 interval の待ち時間（15分。待つ間はマシンを使わない）のあとで次の回を予約する。
# - 自分より新しい回が動いていれば予約しない（予約が二重になっても一本にまとまる）。
# - schedule は予約が途切れたときの予備（1時間ごと）。止めるときは gh workflow disable、再開は enable のあと手動で1回動かす。
#
# 守り:
# - Claude Code（外部パッケージ）は別のジョブ（別のマシン）で動かす。そこにはデータの鍵（DONICHI_KEY）も書き込み権限も無い。
#   投稿の読み取りは道具なし。住所調べだけウェブ検索を許し、施設名・エリア・地域だけを渡す。
#   本文と結果の受け渡しは、受け渡し専用の鍵（AI_KEY）で封をしてジョブの出力で行う。
# - 同期の結果は Claude より先に保存する（Claude が止まっても失われない）。
# - checkout に資格情報を残さず、push のときだけトークンを使う。外部の Action はコミットで固定。
on:
  schedule:
    - cron: "47 * * * *"   # 予備。混み合う毎時0分を避ける
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: state
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      HAS_AI: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && secrets.AI_KEY != '' }}
    outputs:
      need_ai: ${{ steps.sync.outputs.need_ai }}
      ai_in: ${{ steps.sync.outputs.ai_in }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 同期する
        id: sync
        env:
          DONICHI_KEY: ${{ secrets.DONICHI_KEY }}
          AI_KEY: ${{ secrets.AI_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 任意。あれば YouTube の説明欄を公式 API で取る
        run: node scripts/sync.mjs
      - name: 保存する
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: bash scripts/push-state.sh "同期"

  ai:
    needs: sync
    if: needs.sync.outputs.need_ai != '' && needs.sync.outputs.need_ai != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ai_out: ${{ steps.ai.outputs.ai_out }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Claude Code を入れる（版を固定）
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Claude で読み取る
        id: ai
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_KEY: ${{ secrets.AI_KEY }}
          AI_IN: ${{ needs.sync.outputs.ai_in }}
        run: node scripts/ai.mjs

  merge:
    needs: [sync, ai]
    if: always() && needs.sync.result == 'success' && needs.sync.outputs.need_ai != '' && needs.sync.outputs.need_ai != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: 読み取り結果を合わせる
        env:
          DONICHI_KEY: ${{ secrets.DONICHI_KEY }}
          AI_KEY: ${{ secrets.AI_KEY }}
          AI_IN: ${{ needs.sync.outputs.ai_in }}
          AI_OUT: ${{ needs.ai.outputs.ai_out }}
        run: node scripts/ai-merge.mjs
      - name: 保存する
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: bash scripts/push-state.sh "Claude の読み取り"

  next:
    # 15分待ってから次の回を予約する（待つ間はマシンを使わない）。同期の成否に関係なく続ける
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: interval
      deployment: false
    permissions:
      actions: write
    steps:
      - name: 次の回を予約する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/auto-sync.yml" --jq .state)
          if [ "$state" != "active" ]; then echo "止めてあるので予約しません"; exit 0; fi
          newer=$(gh run list -R "$GITHUB_REPOSITORY" --workflow auto-sync.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId > $GITHUB_RUN_ID and .status != \"completed\")] | length")
          if [ "$newer" != "0" ]; then echo "新しい回が動いているので、予約はそちらに任せます"; exit 0; fi
          for i in 1 2 3 4 5; do
            gh workflow run auto-sync.yml -R "$GITHUB_REPOSITORY" --ref main && { echo "次の回を予約しました"; exit 0; }
            sleep 20
          done
          exit 1
